<script src="https://js.puter.com/v2/"></script>
<script>
    async function generateImage(prompt, width, height, image) {
        const result = await puter.ai.txt2img(
            prompt,
            {
                model: "gemini-2.5-flash-image-preview",
                disable_safety_checker: true,
                width: width,
                height: height,
                input_image: image
            }
        );
        // Return the base64
        return result
    }
</script>
